<body>
<!-- หน้าล็อกอิน (แบบเดียวกับแอพเดิม) -->
<section id="login">
  <div class="login-card">
    <img src="logo.jpg" alt="CIB" class="login-logo">
    <h1>ระบบวิเคราะห์ข้อมูล</h1>
    <p class="login-sub">เข้าสู่ระบบด้วยรหัสผ่าน</p>
    <p class="muted">เอกสารลับ — เฉพาะผู้ได้รับอนุญาต</p>
    <form id="loginForm" autocomplete="off">
      <input id="pw" type="password" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน" autofocus>
      <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
    <p id="loginMsg" class="err"></p>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <button id="menuBtn" class="ib only-m" aria-label="เมนู"></button>
    <button id="backBtn" class="ib" aria-label="ย้อนกลับ" title="ย้อนกลับหน้าก่อน" hidden></button>
    <img src="logo.jpg" alt="CIB" class="top-logo only-d">
    <div class="top-title"><b id="pageTitle"></b><span class="only-d"><span id="caseTitle"></span> · <span id="madeAt"></span></span></div>
    <button id="srchBtn" class="sbar" aria-label="ค้นหา"></button>
    <button id="themeBtn" class="ib" aria-label="สลับธีม"></button>
    <a id="logBtn" class="ib" target="_blank" rel="noopener noreferrer" aria-label="ผู้พัฒนา: บันทึกระบบเฝ้าเว็บ" title="ผู้พัฒนา: บันทึกระบบเฝ้าเว็บ (log ผู้บุกรุก)" hidden></a>
    <button id="outBtn" class="ib" aria-label="ออกจากระบบ" title="ออกจากระบบ"></button>
  </header>
  <nav id="tabs" class="side" aria-label="เมนู"></nav>
  <button id="navTgl" class="navtgl" aria-label="หุบเมนูด้านซ้าย" title="หุบเมนู (เหลือแค่ไอคอน)"></button>
  <div id="drawerMask" class="mask" hidden></div>
  <main id="main"></main>
  <nav id="bnav" class="bnav" aria-label="เมนูหลัก"></nav>
  <footer class="foot">เอกสารลับ — ใช้ในการสอบสวนเท่านั้น · ตัวเลขจาก statement ต้องตรวจทานก่อนอ้างอิง · บทบาทบุคคลเป็นข้อสันนิษฐานจากพฤติการณ์ทางการเงิน</footer>
</div>
<div id="search" class="search" hidden><div class="search-box"><div class="search-in"><input id="sq" type="search" placeholder="ค้นหา ชื่อ · เลขบัญชี · รหัสตู้ · รหัสสาขา" autocomplete="off"><button class="ib" data-close="1" aria-label="ปิด">✕</button></div><div id="sres"></div></div></div>
<div id="tip" class="ntip" hidden></div>
<div id="toast" class="toast" hidden></div>
